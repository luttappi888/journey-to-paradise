<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journey to Paradise Travel Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{
  --forest:#123a2c; --forest2:#1d5a44; --gold:#c98a1b; --sun:#f0a030;
  --bg:#f7f4ec; --surface:#ffffff; --ink:#123a2c; --text:#2c3f38; --muted:#667a72; --line:#e2dccb;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0d1f19; --surface:#143026; --ink:#f3e9cf; --text:#cfdcd5; --muted:#92aaa0; --line:#24473a; color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0d1f19; --surface:#143026; --ink:#f3e9cf; --text:#cfdcd5; --muted:#92aaa0; --line:#24473a; color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--text);font:400 1.05rem/1.65 "Nunito Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Cinzel,Georgia,serif;color:var(--ink);margin:0;line-height:1.15}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{position:fixed;top:0;left:0;right:0;z-index:10;background:rgba(18,58,44,.92);backdrop-filter:blur(8px);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#f3e9cf;font:700 1.05rem Cinzel,serif}
.brand img{width:46px;height:46px;border-radius:50%;background:#fff}
nav a{margin-left:22px;text-decoration:none;color:#f3e9cf;font-weight:600;font-size:.95rem}
nav a:hover{color:var(--sun)}
.btn{display:inline-block;background:var(--sun);color:#2a1b00;font:700 1rem "Nunito Sans",sans-serif;border:0;border-radius:999px;padding:13px 28px;text-decoration:none;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(240,160,48,.4)}
.btn.line{background:transparent;color:#f3e9cf;border:2px solid #f3e9cf}
/* hero */
.hero{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:flex-end;color:#fff;background:#0b1a15}
#slides{position:absolute;inset:-4% 0 0;will-change:transform}
.sl,.sv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sl{background-size:cover;background-position:center;opacity:0;transition:opacity 2.4s ease}
.sl.on{opacity:1;animation:kb 14s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
#slides.empty{background:radial-gradient(ellipse at 70% 30%,#2b5d4b 0%,#143228 45%,#0b1a15 100%)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,16,12,.5) 0%,rgba(6,16,12,.12) 40%,rgba(6,16,12,.78) 100%)}
.hero .wrap{position:relative;z-index:5;width:100%;padding-top:100px;padding-bottom:90px;will-change:transform,opacity}
.eyebrow{font:600 .82rem "Nunito Sans",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#f0c875;margin:0 0 14px;animation:fu 1.4s ease .3s backwards}
.hero h1{font-size:clamp(2.2rem,6vw,4.4rem);font-weight:600;color:#fff;max-width:16ch;letter-spacing:.01em;animation:fu 1.6s ease .5s backwards}
.hero .lede{max-width:48ch;font-size:1.15rem;margin:18px 0 28px;color:#eef3ef;animation:fu 1.6s ease .8s backwards}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap;animation:fu 1.6s ease 1.1s backwards}
@keyframes fu{from{opacity:0;transform:translateY(16px)}}
.scroll{position:absolute;z-index:5;bottom:18px;right:24px;width:1px;height:46px;background:linear-gradient(#fff,transparent);animation:ln 2.6s ease-in-out infinite}
@keyframes ln{50%{opacity:.25}}
/* sections */
section{padding:72px 0}
h2{font-size:clamp(1.7rem,4vw,2.5rem);margin-bottom:10px}
.sub{color:var(--muted);max-width:54ch;margin:0 0 28px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.chip{font:600 .95rem "Nunito Sans",sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--forest);color:#f3e9cf;border-color:var(--forest)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-6px);box-shadow:0 14px 30px rgba(18,58,44,.18)}
.art{height:130px;display:grid;place-items:center;font-size:3.2rem;transition:transform .5s}
.card:hover .art{transform:scale(1.06)}
.art-wrap{overflow:hidden}
.card .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:1.2rem}
.meta{color:var(--muted);font-size:.92rem;margin:0}
.card ul{margin:0;padding-left:18px;font-size:.95rem;flex:1}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.price{font:700 1.1rem Cinzel,serif;color:var(--ink)}
.enq{font-weight:700;font-size:.9rem;text-decoration:none;color:var(--forest);background:#f3e2b4;border-radius:999px;padding:8px 16px}
.enq:hover{background:var(--sun)}
/* b2b */
.b2b{background:var(--forest);color:#e6efe9}
.b2b h2{color:#f3e9cf}
.b2b .sub{color:#b6cbc1}
.split{display:grid;gap:40px;grid-template-columns:1fr}
@media(min-width:860px){.split{grid-template-columns:1fr 1.1fr}}
.perks{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.perks li{padding-left:34px;position:relative}
.perks li::before{content:"✓";position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;background:var(--sun);color:#2a1b00;font-weight:700;display:grid;place-items:center;font-size:.85rem}
.perks strong{display:block;color:#fff7e2}
form{background:var(--surface);color:var(--text);border-radius:18px;padding:26px;display:grid;gap:14px;grid-template-columns:1fr 1fr}
.full{grid-column:1/-1}
@media(max-width:560px){form{grid-template-columns:1fr}}
label{font-weight:700;font-size:.9rem;color:var(--ink);display:grid;gap:6px}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;width:100%}
form .btn{background:var(--forest);color:#f3e9cf}
#ok{margin:0;font-weight:700;color:var(--forest2);min-height:1.5em}
footer{background:#0c241b;color:#a9c0b5;padding:34px 0;font-size:.92rem}
footer .wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
footer img{width:56px;height:56px;border-radius:50%;background:#fff}
@media(max-width:620px){nav a:not(.btn){display:none}.brand span{font-size:.9rem}}
/* reveal */
.js .rv{opacity:0;transform:translateY(14px);transition:opacity .8s ease,transform .8s ease;transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js .rv{opacity:1;transform:none}
}

.art{overflow:hidden}.art img{width:100%;height:100%;object-fit:cover;display:block}

.js .rv{transform:translateY(14px);transition:opacity 1.1s ease,transform 1.1s ease;transition-delay:var(--d,0s)}
.js .rv.in{transform:none}
.art{height:200px;background:linear-gradient(135deg,#1d3b31,#0e211a);overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.14)}
.card:hover .art{transform:none}
.card:hover .art img{transform:scale(1.05)}
.pin{width:36px;fill:none;stroke:#e9c77e;stroke-width:1.6}
.adm-hero{display:flex;flex-wrap:wrap;gap:10px}
.adm-hero div{display:grid;gap:4px;justify-items:start}
.adm-hero img{width:96px;height:64px;object-fit:cover;border-radius:8px}
.adm-hero button{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 8px}

footer a{color:#d9e7df;text-decoration:none}footer a:hover{color:var(--sun)}
.split2{display:grid;gap:40px;grid-template-columns:1fr}
@media(min-width:860px){.split2{grid-template-columns:1fr 1.1fr}}
.ct-list{list-style:none;margin:0 0 26px;padding:0;display:grid;gap:16px}
.ct-list span{display:block;font:600 .8rem "Nunito Sans",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ct-list a,.ct-list b{font:600 1.25rem Cinzel,Georgia,serif;color:var(--ink);text-decoration:none;word-break:break-word}
.ct-list a:hover{color:var(--gold)}
.cform{border:1px solid var(--line)}
.cform .row{display:flex;gap:10px;flex-wrap:wrap}
.btn.wab{background:#1f9d55!important;color:#fff!important}
.btn.alt{background:transparent!important;color:var(--ink)!important;border:2px solid var(--forest)}
