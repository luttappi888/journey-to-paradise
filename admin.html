<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin | Journey to Paradise</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#123a2c;--sun:#f0a030;--gold:#c98a1b;--bg:#f7f4ec;--surface:#fff;--ink:#123a2c;--text:#2c3f38;--muted:#667a72;--line:#e2dccb;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.5 "Nunito Sans",system-ui,sans-serif}
h3{font-family:Cinzel,serif;color:var(--ink);margin:0}
.btn{border:0;border-radius:999px;font-weight:700;cursor:pointer;background:var(--forest);color:#f3e9cf;padding:12px 24px;font-size:1rem}
.lg{min-height:100vh;display:grid;place-items:center;padding:20px}
#app.adm{position:static;width:100%;max-width:760px;margin:0 auto;min-height:100vh;height:auto;box-shadow:none;padding-top:0}
.adm-f{position:sticky;bottom:0;background:var(--surface)}
.adm-h a{color:#f3e9cf;margin-right:14px;font-size:.9rem}
.adm-box{max-width:380px;width:100%}
.adm-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--forest);color:#f3e9cf;border:2px solid var(--sun);border-radius:999px;padding:10px 18px;font:700 .95rem "Nunito Sans",sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.adm{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:100;background:var(--surface);color:var(--text);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.35);padding-top:env(safe-area-inset-top,0px);font-size:.95rem}
.adm[hidden]{display:none}
.adm button{font:inherit;cursor:pointer}
.adm-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--forest);color:#f3e9cf}
.adm-h button{background:none;border:0;color:inherit;font-size:1.2rem}
.adm-t{display:flex;border-bottom:1px solid var(--line)}
.adm-t button{flex:1;padding:12px;background:none;border:0;border-bottom:3px solid transparent;color:var(--text);font-weight:700}
.adm-t .on{border-color:var(--sun);color:var(--ink)}
.adm-b{flex:1;overflow:auto;padding:14px 16px;display:grid;gap:10px;align-content:start}
.adm-f{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.adm-f .btn{background:var(--forest);color:#f3e9cf;padding:10px 20px}
.adm-row{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px}
.adm-th{width:48px;height:48px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-size:1.6rem;overflow:hidden;flex:none}
.adm-th img,.adm-img img{width:100%;height:100%;object-fit:cover}
.adm-tx{flex:1;min-width:0;display:grid}
.adm-row button,.adm-fld button,.adm-img button{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.adm-add{background:var(--sun);border:0;border-radius:10px;padding:10px;font-weight:700;color:#2a1b00}
.adm-form,.adm-fld{display:grid;gap:10px;border:1px dashed var(--line);border-radius:10px;padding:12px}
.adm label{display:grid;gap:4px;font-weight:700;font-size:.85rem;color:var(--ink)}
.adm input:not([type=checkbox]):not([type=file]),.adm select,.adm textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.adm .chk{display:flex;align-items:center;gap:8px;font-weight:600}
.adm-img{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.adm-img img{width:90px;height:60px;border-radius:8px}
.adm-up{background:var(--forest);color:#f3e9cf!important;border-radius:8px;padding:8px 12px;cursor:pointer}
.adm-up input{display:none}
.adm-lock{position:fixed;inset:0;z-index:200;background:rgba(6,20,15,.72);display:grid;place-items:center;padding:20px}.adm-box{background:var(--surface);color:var(--text);border-radius:16px;padding:24px;width:min(380px,100%);display:grid;gap:12px}.adm-box h3{font-size:1.3rem}.adm-box p{margin:0}.adm-box label{display:grid;gap:4px;font-weight:700;font-size:.9rem;color:var(--ink)}.adm-box input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}.adm-box .er{color:#c0392b;min-height:1.2em;font-weight:600}.adm-box .btn{background:var(--forest);color:#f3e9cf}.adm-box button.x{font:inherit;background:none;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:12px 20px;cursor:pointer}
</style></head>
<body>
<main id="app" class="lg"></main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var pw='',W,tab='pk',E=-1,Dq=-1,msg='',subs=null,box=$('app');
var G=['linear-gradient(135deg,#1c7c5d,#8fd9b8)','linear-gradient(135deg,#34506b,#a9c7e0)','linear-gradient(135deg,#c9772b,#f2d28a)','linear-gradient(135deg,#b0467a,#f3b7cf)'];
try{pw=sessionStorage.getItem('jp')||''}catch(x){}
function api(p,o){o=o||{};o.headers=Object.assign({'x-admin-password':pw},o.headers||{});return fetch(p,o)}
function loginView(err){box.className='lg';
  box.innerHTML='<form class="adm-box adm-form" id="lf"><h3>Admin login</h3><label>Password<input type="password" id="lp" required autocomplete="current-password"></label><p style="color:#c0392b;margin:0">'+(err||'')+'</p><button class="btn" type="submit">Log in</button></form>';
  $('lf').onsubmit=function(e){e.preventDefault();pw=$('lp').value;
    api('/api/login',{method:'POST'}).then(function(r){if(r.ok){try{sessionStorage.setItem('jp',pw)}catch(x){}load()}else loginView('Wrong password.')}).catch(function(){loginView('Could not connect.')})}}
function load(){
  Promise.all([fetch('/api/site',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null}),fetch('/seed.json').then(function(r){return r.json()})]).then(function(a){
    W=a[0]&&a[0].pk?a[0]:a[1];W.hero=W.hero||{};W.hero.imgs=W.hero.imgs||[];W.ct=W.ct||{};box.className='adm';view()}).catch(function(){box.textContent='Could not load the site data.'})}
function inp(l,p,v){return '<label>'+l+'<input data-p="'+p+'" value="'+esc(v)+'"></label>'}
function pkForm(p,i){var q='pk.'+i+'.';
  return '<div class="adm-form">'+inp('Title',q+'t',p.t)+inp('Duration (for example 5 nights)',q+'d',p.d)+inp('Price (for example ₹24,000)',q+'p',p.p)+
  '<label>Category<select data-p="'+q+'c">'+[['dom','India'],['intl','International'],['adv','Adventure'],['dom adv','India + Adventure']].map(function(o){return '<option value="'+o[0]+'"'+(p.c===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></label>'+
  '<label>Highlights (one per line)<textarea rows="3" data-p="'+q+'h" data-k="lines">'+esc(p.h.join('\n'))+'</textarea></label>'+
  '<div class="adm-img">'+(p.img?'<img src="'+esc(p.img)+'" alt="">':'')+'<label class="adm-up">'+(p.img?'Change image':'Upload image')+'<input type="file" accept="image/*" data-a="img:'+i+'"></label>'+(p.img?'<button data-a="ri:'+i+'">Remove image</button>':'')+'</div></div>'}
function pkView(){return '<button class="adm-add" data-a="add">+ Add package</button>'+(W.pk.map(function(p,i){
  return '<div class="adm-row"><div class="adm-th">'+(p.img?'<img src="'+esc(p.img)+'" alt="">':'📍')+'</div><div class="adm-tx"><b>'+esc(p.t)+'</b><small>'+esc(p.p)+' · '+esc(p.d)+'</small></div>'+
  (Dq===i?'<span>Delete? <button data-a="dy:'+i+'">Yes</button> <button data-a="dn">No</button></span>':'<button data-a="e:'+i+'">'+(E===i?'Close':'Edit')+'</button><button data-a="d:'+i+'">Delete</button>')+'</div>'+(E===i?pkForm(p,i):'')}).join('')||'<p>No packages yet.</p>')}
function hView(){var h=W.hero;
  return '<p>Add 3 to 5 real landscape photos for the top of the website. They fade slowly one after another.</p><div class="adm-hero">'+h.imgs.map(function(u,i){return '<div><img src="'+esc(u)+'" alt=""><button data-a="hx:'+i+'">Remove</button></div>'}).join('')+'</div><label class="adm-up">Add photos<input type="file" accept="image/*" multiple data-a="himg"></label>'}
function bView(){var b=W.b;
  return inp('Section heading','b.title',b.title)+'<label>Intro text<textarea rows="2" data-p="b.intro">'+esc(b.intro)+'</textarea></label>'+inp('Button text','b.btn',b.btn)+inp('Message after sending','b.ok',b.ok)+
  '<label>Benefits (one per line: Title | description)<textarea rows="5" data-p="b.perks" data-k="perks">'+esc(b.perks.map(function(p){return p.t+' | '+p.d}).join('\n'))+'</textarea></label><b>Form fields</b>'+
  b.fields.map(function(f,i){var q='b.fields.'+i+'.';
    return '<div class="adm-fld"><input data-p="'+q+'l" value="'+esc(f.l)+'" aria-label="Field label"><select data-p="'+q+'type" aria-label="Field type">'+['text','email','tel','number','textarea','select'].map(function(t){return '<option'+(f.type===t?' selected':'')+'>'+t+'</option>'}).join('')+'</select>'+
    '<label class="chk"><input type="checkbox" data-p="'+q+'req"'+(f.req?' checked':'')+'> Required</label><label class="chk"><input type="checkbox" data-p="'+q+'full"'+(f.full?' checked':'')+'> Full width</label>'+
    (f.type==='select'?'<input data-p="'+q+'opts" data-k="csv" value="'+esc((f.opts||[]).join(', '))+'" placeholder="Options, comma separated" aria-label="Options">':'')+
    '<span><button data-a="fu:'+i+'">↑</button> <button data-a="fd:'+i+'">↓</button> <button data-a="fx:'+i+'">Delete</button></span></div>'}).join('')+'<button class="adm-add" data-a="af">+ Add field</button>'}
function cView(){var c=W.ct;return inp('Phone 1 (with country code, also used for WhatsApp)','ct.p1',c.p1)+inp('Phone 2','ct.p2',c.p2)+inp('Email','ct.email',c.email)+inp('Address (optional)','ct.addr',c.addr)+inp('Working hours (optional)','ct.hrs',c.hrs)}
function sView(){if(!subs)return '<p>Loading…</p>';if(!subs.length)return '<p>No requests yet.</p>';
  return subs.map(function(s){return '<div class="adm-form"><b>'+(s.type==='partner'?'Partner request':'Trip enquiry')+'</b><small>'+esc(new Date(s.time).toLocaleString())+'</small>'+Object.keys(s.data).map(function(k){return s.data[k]?'<div><small>'+esc(k)+'</small><br>'+esc(s.data[k])+'</div>':''}).join('')+'<button data-a="sd:'+s.id+'">Delete</button></div>'}).join('')}
function view(){var o=box.querySelector('.adm-b'),top=o?o.scrollTop:0,T=[['pk','Packages'],['h','Hero'],['b','Partner form'],['c','Contact'],['s','Requests']];
  box.innerHTML='<div class="adm-h"><strong>Admin panel</strong><span><a href="/" target="_blank">View site</a><a href="#" data-a="lo">Log out</a></span></div><div class="adm-t">'+T.map(function(t){return '<button data-a="t:'+t[0]+'"'+(tab===t[0]?' class="on"':'')+'>'+t[1]+'</button>'}).join('')+'</div><div class="adm-b">'+(tab==='pk'?pkView():tab==='h'?hView():tab==='b'?bView():tab==='c'?cView():sView())+'</div><div class="adm-f"><span>'+esc(msg)+'</span><button class="btn" data-a="save">Save and publish</button></div>';
  o=box.querySelector('.adm-b');if(o)o.scrollTop=top}
function setp(path,v){var a=path.split('.'),o=W,i;for(i=0;i<a.length-1;i++){if(o[a[i]]==null)o[a[i]]={};o=o[a[i]]}o[a[a.length-1]]=v}
function swap(i,j){var f=W.b.fields,x=f[i];f[i]=f[j];f[j]=x}
function shrink(file){return createImageBitmap(file).then(function(bm){var s=Math.min(1,1600/bm.width),c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return new Promise(function(ok){c.toBlob(function(b){ok(b||file)},'image/jpeg',.82)})}).catch(function(){return file})}
function up(file){return shrink(file).then(function(b){return api('/api/upload',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:b})}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){return j.url})}
function save(){msg='Saving…';view();api('/api/site',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(W)}).then(function(r){msg=r.ok?'Saved. Your website is updated.':'Save failed ('+r.status+')';view()}).catch(function(){msg='Could not save.';view()})}
function loadSubs(){subs=null;api('/api/submit').then(function(r){return r.json()}).then(function(l){subs=l;view()}).catch(function(){subs=[];view()})}
function onv(e){var t=e.target,p=t.dataset.p,k=t.dataset.k,v;
  if(t.type==='file'&&e.type==='change'){var a=t.dataset.a,fl=[].slice.call(t.files);if(!fl.length)return;msg='Uploading…';view();
    if(a==='himg')Promise.all(fl.map(up)).then(function(us){W.hero.imgs=W.hero.imgs.concat(us);msg='Photos added. Press Save and publish.';view()}).catch(function(){msg='Upload failed. Use photos under 4 MB.';view()});
    else{var i=+a.split(':')[1];up(fl[0]).then(function(u){W.pk[i].img=u;msg='Image added. Press Save and publish.';view()}).catch(function(){msg='Upload failed. Use a photo under 4 MB.';view()})}return}
  if(!p)return;v=t.type==='checkbox'?t.checked:t.value;
  if(k==='lines')v=v.split('\n').map(function(x){return x.trim()}).filter(Boolean);
  else if(k==='csv')v=v.split(',').map(function(x){return x.trim()}).filter(Boolean);
  else if(k==='perks')v=v.split('\n').filter(function(x){return x.trim()}).map(function(l){var a=l.split('|');return{t:a[0].trim(),d:(a[1]||'').trim()}});
  setp(p,v);
  if(/\.type$/.test(p)&&e.type==='change'){var f=W.b.fields[+p.split('.')[2]];if(v==='select'&&!(f.opts&&f.opts.length))f.opts=['Option 1','Option 2'];view()}}
box.addEventListener('input',onv);box.addEventListener('change',onv);
box.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t||t.type==='file')return;e.preventDefault();var a=t.dataset.a.split(':'),k=a[0],i=+a[1];
  if(k==='lo'){try{sessionStorage.removeItem('jp')}catch(x){}pw='';loginView();return}
  if(k==='t'){tab=a[1];if(tab==='s'){loadSubs()}}
  else if(k==='add'){W.pk.unshift({id:'p'+Date.now(),e:'📍',t:'New package',d:'5 nights',c:'dom',p:'₹0',h:['Highlight one','Highlight two'],g:G[W.pk.length%G.length],img:''});E=0;tab='pk'}
  else if(k==='e')E=E===i?-1:i;
  else if(k==='d')Dq=i;
  else if(k==='dn')Dq=-1;
  else if(k==='dy'){W.pk.splice(i,1);Dq=-1;E=-1}
  else if(k==='ri')W.pk[i].img='';
  else if(k==='hx')W.hero.imgs.splice(i,1);
  else if(k==='af')W.b.fields.push({k:'f'+Date.now(),l:'New field',type:'text',req:false,full:false,opts:[]});
  else if(k==='fx')W.b.fields.splice(i,1);
  else if(k==='fu'&&i>0)swap(i,i-1);
  else if(k==='fd'&&i<W.b.fields.length-1)swap(i,i+1);
  else if(k==='sd'){var id=a[1];api('/api/submit?id='+encodeURIComponent(id),{method:'DELETE'}).then(loadSubs);return}
  else if(k==='save'){save();return}
  view()});
if(pw)api('/api/login',{method:'POST'}).then(function(r){r.ok?load():loginView()}).catch(function(){loginView()});else loginView();
})();
</script>
</body></html>
