<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Accounts | Journey to Paradise</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#123a2c;--gold:#c98a1b;--sun:#f0a030;--bg:#f7f4ec;--card:#fff;--ink:#123a2c;--text:#2c3f38;--muted:#667a72;--line:#e2dccb;--red:#b3402f;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0d1f19;--card:#143026;--ink:#f3e9cf;--text:#cfdcd5;--muted:#92aaa0;--line:#24473a;--red:#e58b7c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.45 "Nunito Sans",system-ui,sans-serif;padding-bottom:90px}
h1,h2,h3{font-family:Cinzel,Georgia,serif;color:var(--ink);margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header{background:var(--forest);color:#f3e9cf;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
header img{width:40px;height:40px;border-radius:50%;background:#fff}
header b{font:700 1rem Cinzel,serif;flex:1}
header small{display:block;font:400 .78rem "Nunito Sans";opacity:.8}
header button{background:none;border:1px solid #f3e9cf55;color:#f3e9cf;border-radius:999px;padding:6px 12px;font-size:.85rem}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:calc(61px + env(safe-area-inset-top,0px));z-index:19}
.tabs button{flex:1;padding:12px 4px;background:none;border:0;border-bottom:3px solid transparent;color:var(--text);font-weight:700;font-size:.92rem}
.tabs .on{border-color:var(--sun);color:var(--ink)}
main{max-width:720px;margin:0 auto;padding:16px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar input,.bar select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat small{color:var(--muted);font-weight:600}
.stat b{display:block;font:700 1.35rem Cinzel,serif;color:var(--ink);margin-top:4px}
.stat.gold b{color:var(--gold)}
h3{font-size:1.05rem;margin:18px 0 10px}
.cat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-bottom:10px;font-size:.92rem}
.cat i{grid-column:1/-1;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.cat i span{display:block;height:100%;background:var(--gold)}
.day{font-weight:700;color:var(--muted);font-size:.85rem;margin:16px 0 6px;display:flex;justify-content:space-between}
.row{width:100%;text-align:left;display:flex;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;color:var(--text)}
.row b{color:var(--ink)}
.row small{display:block;color:var(--muted)}
.amt{font:700 1.05rem Cinzel,serif;color:var(--ink);white-space:nowrap;text-align:right}
.amt.g{color:var(--gold)}
.amt small{font:600 .78rem "Nunito Sans";color:var(--red)}
.amt small.ok{color:#2e8b57}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chips button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--text);font-weight:600}
.chips .on{background:var(--forest);color:#f3e9cf;border-color:var(--forest)}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--sun);color:#2a1b00;border:0;border-radius:999px;padding:14px 22px;font-weight:700;font-size:1rem;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600}
.btn{background:var(--forest);color:#f3e9cf;border:0;border-radius:999px;padding:12px 24px;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(6,20,15,.65);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
@media(min-width:620px){.ov{align-items:center}.sheet{border-radius:18px}}
.sheet label{display:grid;gap:4px;font-weight:700;font-size:.88rem;color:var(--ink)}
.sheet input,.sheet select,.sheet textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--red);font-weight:600;margin:0;min-height:1.2em}
.login{max-width:360px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;display:grid;gap:14px}
.login img{width:84px;height:84px;border-radius:50%;margin:0 auto;display:block;background:#fff}
.login h2{text-align:center;font-size:1.3rem}
.login label{display:grid;gap:4px;font-weight:700;font-size:.9rem;color:var(--ink)}
.login input[type=text],.login input[type=password]{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.keep{display:flex!important;grid-auto-flow:column;align-items:center;gap:8px;font-weight:600!important}
</style></head>

<script>
const $=i=>document.getElementById(i);
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});

const CATS=['Fuel','Hotel','Food','Tickets and transport','Salary','Office','Marketing','Commission','Other'];
const MODES=['Cash','UPI','Bank transfer','Card'];
let cred=null,me='',D={exp:[],adv:[],note:[]},tab='home',month=today().slice(0,7),filt='all',confirmDel=false;

const api=(kind,o={},q='')=>fetch('/api/ledger?kind='+kind+q,{...o,headers:{'x-user':cred.u,'x-pass':cred.p,'Content-Type':'application/json'}});
async function loadAll(){
  const r=await Promise.all(['exp','adv','note'].map(k=>api(k).then(x=>{if(x.status===401)throw 401;return x.json()})));

}

async function start(){
  $('login').hidden=true;$('shell').hidden=false;$('who').textContent=me;
  try{await loadAll()}catch(x){logout()}
}
function logout(){localStorage.removeItem('lg');sessionStorage.removeItem('lg');cred=null;loginView()}

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('v').innerHTML=tab==='home'?home():tab==='exp'?expView():tab==='adv'?advView():noteView();
  $('fab').textContent=tab==='adv'?'+ Advance':tab==='note'?'+ Note':'+ Expense';
}
const monthBar=()=>`<div class="bar"><input type="month" id="mp" value="${month}" aria-label="Month"></div>`;
function home(){
  const t=today(),ex=D.exp.filter(x=>x.date.startsWith(month));
  const pending=D.adv.reduce((s,x)=>s+Math.max(0,(x.total||0)-x.amount),0);
  const cats={};ex.forEach(x=>{const c=x.cat||'Other';cats[c]=(cats[c]||0)+x.amount});
  const list=Object.entries(cats).sort((a,b)=>b[1]-a[1]),mx=list.length?list[0][1]:1;
  return monthBar()+`<div class="grid"><div class="stat"><small>Spent today</small><b>${inr(sum(D.exp.filter(x=>x.date===t)))}</b></div><div class="stat"><small>Spent this month</small><b>${inr(sum(ex))}</b></div><div class="stat gold"><small>Advances received this month</small><b>${inr(sum(D.adv.filter(x=>x.date.startsWith(month))))}</b></div><div class="stat gold"><small>Balance still to collect</small><b>${inr(pending)}</b></div></div><h3>Spending by category</h3>`+
  (list.length?list.map(([c,v])=>`<div class="cat"><span>${esc(c)}</span><b>${inr(v)}</b><i><span style="width:${Math.max(4,v/mx*100)}%"></span></i></div>`).join(''):'<p class="empty">No expenses this month.</p>')+
  `<div class="acts" style="margin-top:20px"><button class="ghost" id="csv">Download this month (CSV)</button></div>`;
}
function expView(){
  const ex=D.exp.filter(x=>x.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)||b.at.localeCompare(a.at));
  if(!ex.length)return monthBar()+'<p class="empty">No expenses this month. Tap + Expense to add one.</p>';
  const days={};ex.forEach(x=>(days[x.date]=days[x.date]||[]).push(x));
  return monthBar()+`<div class="day"><span>Month total</span><b>${inr(sum(ex))}</b></div>`+Object.keys(days).map(d=>`<div class="day"><span>${fmt(d)}</span><span>${inr(sum(days[d]))}</span></div>`+days[d].map(x=>`<button class="row" data-e="exp:${x.id}"><span><b>${esc(x.desc||x.cat||'Expense')}</b><small>${esc([x.cat,x.trip,x.paidBy&&'Paid by '+x.paidBy].filter(Boolean).join(' · '))}</small></span><span class="amt">${inr(x.amount)}</span></button>`).join('')).join('');
}
function advView(){
  const bal=x=>Math.max(0,(x.total||0)-x.amount);
  let a=D.adv.slice().sort((x,y)=>y.date.localeCompare(x.date));
  if(filt==='open')a=a.filter(x=>bal(x)>0);if(filt==='paid')a=a.filter(x=>x.total>0&&bal(x)===0);
  return `<div class="chips">${[['all','All'],['open','Balance due'],['paid','Paid in full']].map(c=>`<button data-f="${c[0]}" class="${filt===c[0]?'on':''}">${c[1]}</button>`).join('')}</div>`+
  (a.length?a.map(x=>`<button class="row" data-e="adv:${x.id}"><span><b>${esc(x.customer)}</b><small>${esc([x.trip,fmt(x.date),x.mode].filter(Boolean).join(' · '))}</small></span><span class="amt g">${inr(x.amount)}${x.total?(bal(x)>0?`<small>Balance ${inr(bal(x))}</small>`:'<small class="ok">Paid in full</small>'):''}</span></button>`).join(''):'<p class="empty">No advances here. Tap + Advance to add one.</p>');
}
function noteView(){
  const n=D.note.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.at.localeCompare(a.at));
  return n.length?n.map(x=>`<button class="row" data-e="note:${x.id}"><span><b>${esc(x.title||'Note')}</b><small style="white-space:pre-wrap">${esc(x.text.slice(0,160))}</small><small>${fmt(x.date)} · ${esc(x.by)}</small></span></button>`).join(''):'<p class="empty">No notes yet. Tap + Note to add one.</p>';
}
const fld=(l,n,v,t='text',x='')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x}></label>`;
const sel=(l,n,o,v)=>`<label>${l}<select name="${n}">${o.map(c=>`<option${c===v?' selected':''}>${esc(c)}</option>`).join('')}</select></label>`;
function openForm(kind,it){
  confirmDel=false;const isNew=!it;it=it||{};let h,title;
  if(kind==='exp'){title=isNew?'Add expense':'Edit expense';h=fld('Date','date',it.date||today(),'date','required')+fld('Amount (₹)','amount',it.amount??'','number','required inputmode="decimal" min="0" step="0.01"')+sel('Category','cat',CATS,it.cat)+fld('What was it for?','desc',it.desc||'')+fld('Paid by','paidBy',it.paidBy||me)+fld('Trip or customer (optional)','trip',it.trip||'')}
  else if(kind==='adv'){title=isNew?'Add advance':'Edit advance';h=fld('Customer name','customer',it.customer||'','text','required')+fld('Phone (optional)','phone',it.phone||'','tel')+fld('Trip or package','trip',it.trip||'')+`<div class="two">${fld('Total package amount (₹)','total',it.total||'','number','inputmode="decimal" min="0" step="0.01"')}${fld('Advance received (₹)','amount',it.amount??'','number','required inputmode="decimal" min="0" step="0.01"')}</div><div class="two">${fld('Date received','date',it.date||today(),'date','required')}${sel('Payment mode','mode',MODES,it.mode)}</div>`+fld('Note','note',it.note||'')+(isNew?'':'<button type="button" class="ghost" id="full">Customer paid the full amount</button>')}
  else{title=isNew?'Add note':'Edit note';h=fld('Title','title',it.title||'')+`<label>Note<textarea name="text" rows="6" required>${esc(it.text||'')}</textarea></label>`+fld('Date','date',it.date||today(),'date')}
  const by=it.by?`<small style="color:var(--muted)">Added by ${esc(it.by)}${it.editedBy?' · last edited by '+esc(it.editedBy):''}</small>`:'';
  $('m').hidden=false;
  $('m').innerHTML=`<div class="ov"><form class="sheet" id="mf"><h2>${title}</h2>${h}${by}<p class="err" id="me"></p><div class="acts"><button class="btn" type="submit">Save</button><button type="button" class="ghost" id="cl">Cancel</button>${isNew?'':'<button type="button" class="ghost" id="del" style="margin-left:auto;color:var(--red)">Delete</button>'}</div></form></div>`;
  $('cl').onclick=closeForm;
  if($('full'))$('full').onclick=()=>{const f=$('mf').elements;if(f.total.value)f.amount.value=f.total.value;else $('me').textContent='Enter the total package amount first.'};
  if($('del'))$('del').onclick=async()=>{if(!confirmDel){confirmDel=true;$('del').textContent='Tap again to delete';return}
    await api(kind,{method:'DELETE'},'&id='+encodeURIComponent(it.id));D[kind]=D[kind].filter(x=>x.id!==it.id);closeForm();render()};
  $('mf').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));if(it.id)o.id=it.id;
    $('me').textContent='Saving…';
    try{const r=await api(kind,{method:'POST',body:JSON.stringify({item:o})});if(!r.ok){$('me').textContent='Could not save. Please check the amount and date.';return}
      const s=await r.json();D[kind]=D[kind].filter(x=>x.id!==s.id).concat(s);closeForm();render()}catch(x){$('me').textContent='Could not connect. Try again.'}};
}
function closeForm(){$('m').hidden=true;$('m').innerHTML=''}
function csv(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Type','Date','Category or customer','Description or trip','Amount','Total package','Balance','Added by']];
  D.exp.filter(x=>x.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>rows.push(['Expense',x.date,x.cat,[x.desc,x.trip].filter(Boolean).join(' / '),x.amount,'','',x.by]));
  D.adv.filter(x=>x.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>rows.push(['Advance',x.date,x.customer,x.trip,x.amount,x.total||'',x.total?Math.max(0,x.total-x.amount):'',x.by]));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='accounts-'+month+'.csv';document.body.appendChild(a);a.click();a.remove();
}
